name: Userspace integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  userspace-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: tests/client/go.sum
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Run userspace integration and client tests
        run: python3 tests/integration.py
      - name: Run Rust tests
        run: cargo test --locked
      - name: Verify checked-in OpenAPI contract
        run: cargo run --locked -- export-openapi > "$RUNNER_TEMP/openapi.json" && cmp openapi.json "$RUNNER_TEMP/openapi.json"
  frontend-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Playwright Chrome and system dependencies
        run: pnpm --dir frontend exec playwright install --with-deps chrome
      - name: Build production frontend
        run: pnpm --dir frontend build
      - name: Run isolated UI regression tests
        run: pnpm --dir frontend test:ui
        env:
          PLAYWRIGHT_CHANNEL: chrome
          WIREHUB_UI_SCREENSHOTS: ${{ runner.temp }}/wirehub-ui-screenshots
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wirehub-ui-screenshots
          path: ${{ runner.temp }}/wirehub-ui-screenshots
          if-no-files-found: ignore
