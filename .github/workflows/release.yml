name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/touken928/wirehub

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tag and package version agreement
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/check-release.py --tag "$REF_NAME"
          else
            python3 scripts/check-release.py
          fi
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/integration.yml
  binaries:
    needs: [verify, release-contract]
    name: Build ${{ matrix.name }} binary
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build frontend
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build
      - name: Build release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          VERSION: ${{ github.ref_name }}
          WIREHUB_BUILD_ID: ${{ github.sha }}
        run: |
          cargo build --release --locked --target '${{ matrix.target }}'
          python3 scripts/check-release.py --binary 'target/${{ matrix.target }}/release/wirehub' --build-id "$WIREHUB_BUILD_ID"
          mkdir -p dist
          cp 'target/${{ matrix.target }}/release/wirehub' \
            "dist/wirehub-${VERSION}-${{ matrix.name }}"
      - name: Verify binary startup and embedded UI
        env:
          BINARY_PATH: dist/wirehub-${{ github.ref_name }}-${{ matrix.name }}
        run: |
          python - <<'PY'
          import json, os, socket, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          binary = str(Path(os.environ['BINARY_PATH']).resolve())
          with tempfile.TemporaryDirectory() as directory:
              with socket.socket() as tcp, socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as udp:
                  tcp.bind(('127.0.0.1', 0))
                  port = tcp.getsockname()[1]
                  udp.bind(('0.0.0.0', port))
              env = {key: value for key, value in os.environ.items() if not key.startswith('WIREHUB_')}
              env.update(WIREHUB_ADMIN_TOKEN='binary-smoke-test', WIREHUB_PORT=str(port),
                         WIREHUB_DB=str(Path(directory) / 'hub.sqlite3'),
                         WIREHUB_HUB_KEY=str(Path(directory) / 'hub.key'))
              with open(Path(directory) / 'hub.log', 'wb') as log:
                  process = subprocess.Popen([binary], cwd=directory, env=env, stdout=log, stderr=log)
                  try:
                      url = f'http://127.0.0.1:{port}'
                      for attempt in range(60):
                          if process.poll() is not None:
                              raise SystemExit(f'Binary exited during startup: {process.returncode}')
                          try:
                              with urllib.request.urlopen(url + '/api/health', timeout=1) as response:
                                  assert json.load(response)['ok']
                              break
                          except OSError:
                              time.sleep(0.5)
                      else:
                          raise SystemExit('Binary health check timed out')
                      with urllib.request.urlopen(url, timeout=5) as response:
                          assert 'WireHub' in response.read().decode()
                      print('PASS: binary startup and embedded UI')
                  finally:
                      process.terminate()
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/wirehub-*
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [verify, release-contract]
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: WIREHUB_BUILD_ID=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: wirehub:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Verify container startup and embedded UI
        run: |
          docker run --rm wirehub:smoke --version > "$RUNNER_TEMP/container-version.txt"
          EXPECTED_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$(cat "$RUNNER_TEMP/container-version.txt")" = "wirehub $EXPECTED_VERSION (${{ github.sha }})"
          trap 'docker rm --force wirehub-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name wirehub-smoke \
            --env WIREHUB_ADMIN_TOKEN=smoke-test-token \
            --env WIREHUB_TRUSTED_PROXY_MODE=1 \
            --publish 127.0.0.1::51820/tcp wirehub:smoke
          SMOKE_ADDRESS=$(docker port wirehub-smoke 51820/tcp)
          export SMOKE_ADDRESS
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = 'http://' + os.environ['SMOKE_ADDRESS']
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(url + '/api/health', timeout=1) as response:
                      assert json.load(response)['ok']
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Container health check timed out')
          with urllib.request.urlopen(url, timeout=5) as response:
              assert 'WireHub' in response.read().decode()
          print('PASS: container health and embedded UI')
          PY
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image by digest
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: WIREHUB_BUILD_ID=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform tags
    if: github.event_name == 'push'
    needs: [verify, release-contract, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
      - name: Publish and inspect manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          METADATA: ${{ steps.meta.outputs.json }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag", .' <<< "$METADATA")
          images=()
          for digest in *; do images+=("$IMAGE_NAME@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION"

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [verify, release-contract, binaries, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum wirehub-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/wirehub-*
            dist/SHA256SUMS
          body: |
            ## Changes

            - Atomic configuration revisions, stale-write rejection and safer live ACL activation.
            - Management UI conflict recovery, retained drafts and clearer runtime status.
            - Structured API errors, updated OpenAPI contract and bounded graceful shutdown.
            - Paired database/Hub-key backup tooling and expanded network, operations and endurance checks.

            ## Acceptance and upgrade

            This release targets Linux servers with one Hub and a private IPv4 /24.
            Mobile and desktop interoperability are outside this release's acceptance scope.
            Review the [supported network behavior](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/operations.md#supported-scope)
            and [release verification](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/release.md).

            The database schema is now 5. Before upgrading, stop the service and preserve a
            verified database/Hub-key pair. Rollback requires restoring the pre-upgrade pair;
            do not open a migrated database with an older binary. See the
            [backup and rollback procedure](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/operations.md#paired-backup-upgrade-and-rollback).

            ## Downloads

            | Platform | Binary |
            | --- | --- |
            | Linux amd64 | `wirehub-${{ github.ref_name }}-linux-amd64` |
            | Linux arm64 | `wirehub-${{ github.ref_name }}-linux-arm64` |

            Download the binary for your platform. The web UI is included.
            Set `WIREHUB_ADMIN_TOKEN`, start WireHub, and open http://localhost:51820.
            See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for startup commands.

            ## Docker

            ```sh
            docker pull ghcr.io/touken928/wirehub:${{ github.ref_name }}
            ```

            Supports Linux amd64 and arm64. `SHA256SUMS` contains checksums for the binaries.
