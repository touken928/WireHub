name: Set up frontend
description: Install the pinned pnpm and Node.js versions with a shared dependency cache.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.9
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - shell: bash
      run: pnpm --dir frontend install --frozen-lockfile
